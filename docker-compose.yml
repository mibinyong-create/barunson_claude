# 로컬 개발 전용 PostgreSQL.
# 배포 환경(Docker Manager)에서는 공유 서비스 shared-postgres 를 사용하므로
# 이 파일은 배포에 사용하지 않습니다.
# 비밀번호는 같은 디렉토리의 .env 에서 읽습니다 (.env 는 커밋되지 않습니다).
services:
  postgres:
    image: postgres:17-alpine
    container_name: barunson-order-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-order_manager}
      POSTGRES_USER: ${POSTGRES_USER:-order_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
      LANG: ko_KR.utf8
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
