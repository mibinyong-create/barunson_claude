services:
  postgres:
    image: postgres:17-alpine
    container_name: barunson-order-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: order_manager
      POSTGRES_USER: order_admin
      POSTGRES_PASSWORD: order_admin_pw
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
      LANG: ko_KR.utf8
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_admin -d order_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
