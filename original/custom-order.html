<title>커스텀 주문관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --surface:#FFFFFF;
    --surface-sunken:#F5F5F3;
    --ink:#232022;
    --ink-muted:#736C68;
    --ink-faint:#A39C97;
    --line:#EAE8E5;
    --line-strong:#DAD7D2;
    --accent:#1FB6AC;
    --accent-hover:#189E96;
    --accent-ink:#FFFFFF;
    --accent-soft:#E0F7F4;
    --accent-soft-ink:#0F766E;
    --focus:#1FB6AC;
    --urgent:#C42B2B;

    --st-received-ink:#3E5D78; --st-received-bg:#E6EDF3;
    --st-draft-ink:#5B6472; --st-draft-bg:#E9ECEF;
    --st-production-ink:#93691F; --st-production-bg:#F4EAD3;
    --st-ready-ink:#5B4C96; --st-ready-bg:#EAE5F5;
    --st-outsource-ink:#B4551E; --st-outsource-bg:#F7E3CE;
    --st-printed-ink:#9C4B6B; --st-printed-bg:#F6E3EC;
    --st-shipping-ink:#256F5D; --st-shipping-bg:#DFEEE9;
    --st-done-ink:#3B7A45; --st-done-bg:#E1F0E3;
    --st-cancelled-ink:#8C4A4A; --st-cancelled-bg:#F3E3E3;

    --pay-wait-ink:#93691F; --pay-wait-bg:#F4EAD3;
    --pay-done-ink:#3B7A45; --pay-done-bg:#E1F0E3;

    --selected-bg:#EAF7EA; --selected-ink:#2E7D32; --selected-check:#43A047;

    --sidebar-bg:#1E2A3D;
    --sidebar-bg-active:#243349;
    --sidebar-ink:#8E9BB3;
    --sidebar-ink-active:#FFFFFF;
    --sidebar-brand:#2FD1C5;
    --table-head-bg:#28364B;
    --table-head-ink:#EAF0F7;

    --shadow:0 1px 2px rgba(42,35,48,0.06),0 8px 24px -12px rgba(42,35,48,0.18);
    --shadow-lg:0 4px 8px rgba(42,35,48,0.08),0 24px 48px -16px rgba(42,35,48,0.28);
    --radius:10px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Gothic A1",-apple-system,"Malgun Gothic",sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-soft);color:var(--accent-soft-ink);}
  *:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  button{font-family:inherit;}

  /* shell + sidebar */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:220px;flex:none;background:var(--sidebar-bg);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  }
  .sidebar-brand{
    display:flex;align-items:center;gap:9px;padding:22px 20px;
    font-family:"Gothic A1",sans-serif;font-weight:900;font-size:17px;
    color:var(--sidebar-brand);letter-spacing:-0.01em;
  }
  .sidebar-brand .dot{width:9px;height:9px;border-radius:3px;background:var(--sidebar-brand);flex:none;}
  .sidebar-nav{display:flex;flex-direction:column;padding:10px 12px;gap:2px;}
  .nav-item{
    display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:8px;
    color:var(--sidebar-ink);text-decoration:none;font-size:13.5px;font-weight:600;
    cursor:pointer;transition:background .12s,color .12s;
  }
  .nav-item svg{flex:none;opacity:.85;}
  .nav-item:hover{background:var(--sidebar-bg-active);color:var(--sidebar-ink-active);}
  .nav-item.active{background:var(--accent);color:var(--accent-ink);}
  .nav-item.active svg{opacity:1;}

  .main{flex:1;min-width:0;background:var(--paper);}

  /* top bar */
  .topbar-new{
    display:flex;align-items:center;justify-content:flex-end;gap:16px;
    padding:14px 28px;border-bottom:1px solid var(--line);background:var(--surface);
  }
  .toolbar-search{
    position:relative;flex:1 1 240px;max-width:320px;
  }
  .toolbar-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-faint);}
  .toolbar-search input{
    width:100%;padding:9px 12px 9px 36px;border-radius:8px;border:1px solid var(--line-strong);
    background:var(--surface);color:var(--ink);font-size:13.5px;
  }
  .topbar-right{display:flex;align-items:center;gap:16px;flex:none;}
  .bell-btn{
    position:relative;width:34px;height:34px;border-radius:8px;border:1px solid var(--line-strong);
    background:var(--surface);color:var(--ink-muted);cursor:default;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .bell-btn .badge{
    position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 3px;
    border-radius:999px;background:var(--accent);color:var(--accent-ink);
    font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;
    font-family:"IBM Plex Mono",monospace;
  }
  .user-chip{display:flex;align-items:center;gap:8px;}
  .user-chip .avatar{
    width:30px;height:30px;border-radius:50%;background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;font-size:15px;
  }
  .user-chip .uname{font-size:13px;font-weight:700;color:var(--ink);}

  /* page head */
  .page-head{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:22px 28px 4px;flex-wrap:wrap;gap:6px;
  }
  .page-head h1{
    font-family:"Gothic A1",sans-serif;font-weight:800;
    font-size:22px;margin:0;letter-spacing:-0.02em;color:var(--ink);
  }
  .breadcrumb{font-size:12px;color:var(--ink-faint);margin-top:4px;}
  .breadcrumb .sep{margin:0 6px;color:var(--ink-faint);}
  .breadcrumb .current{color:var(--ink-muted);font-weight:600;}
  .today{
    font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-faint);
    font-variant-numeric:tabular-nums;
  }

  .app{max-width:1180px;padding:16px 28px 64px;}

  /* view tabs */
  .view-tabs{display:flex;align-items:center;gap:22px;border-bottom:1px solid var(--line);margin-bottom:20px;}
  .view-tab{
    display:flex;align-items:center;gap:7px;padding:10px 2px;background:none;border:none;
    border-bottom:2px solid transparent;transform:translateY(1px);
    font-family:"Gothic A1",sans-serif;font-size:14.5px;font-weight:700;color:var(--ink-muted);cursor:pointer;
    transition:color .12s,border-color .12s;
  }
  .view-tab:hover{color:var(--ink);}
  .view-tab.active{color:var(--ink);border-bottom-color:var(--accent);}
  .view-tab .view-tab-badge{
    font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700;
    background:var(--surface-sunken);color:var(--ink-muted);padding:2px 8px;border-radius:999px;
    font-variant-numeric:tabular-nums;
  }
  .view-tab.active .view-tab-badge{background:var(--accent-soft);color:var(--accent-soft-ink);}
  #summaryView[hidden], #listView[hidden]{display:none;}

  /* toast */
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);font-size:13px;font-weight:600;
    padding:10px 18px;border-radius:8px;box-shadow:var(--shadow-lg);z-index:80;
    opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  /* stat tiles */
  .stats{
    display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px;
  }
  .stat{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--shadow);
  }
  .stat .label{
    font-size:11.5px;color:var(--ink-muted);letter-spacing:0.03em;
    display:flex;align-items:center;gap:6px;margin-bottom:8px;
  }
  .stat .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;}
  .stat .value{
    font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:24px;
    font-variant-numeric:tabular-nums;color:var(--ink);
  }
  .stat .value small{font-family:"Gothic A1",sans-serif;font-size:13px;font-weight:500;color:var(--ink-muted);margin-left:2px;}

  /* trend card */
  .trend-card{

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ state.orders = JSON.parse(raw); return; }
    }catch(e){}
    state.orders = seedData();
    save();

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.orders)); }catch(e){}
  }
  function nextOrderNo(){
    var max = 0;
    state.orders.forEach(function(o){
      var m = /ORD-2026-(\d+)/.exec(o.orderNo);
      if(m) max = Math.max(max, parseInt(m[1],10));
    });
    return "ORD-2026-" + String(max+1).padStart(6,"0");
  }
  function nextId(){
    var max = 0;
    state.orders.forEach(function(o){ max = Math.max(max, o.id); });
    return max + 1;
  }
  function won(n){ return "₩" + Number(n||0).toLocaleString("ko-KR"); }
  function fmtDate(d){
    if(!d) return "-";
    var p = d.split("-");
    return p[0] + "." + p[1] + "." + p[2];
  }
  function diffDays(weddingDate){
    return Math.round((new Date(weddingDate) - new Date(TODAY)) / 86400000);
  }
  function dday(diff){
    if(diff === 0) return "D-DAY";
    if(diff > 0) return "D-" + diff;
    return "D+" + Math.abs(diff);
  }
  function orderNoShort(orderNo){
    var m = /(\d{6})$/.exec(orderNo || "");
    return m ? m[1] : (orderNo || "");
  }

  // ---------- rendering ----------
  function renderStats(){
    var total = state.orders.length;
    var active = state.orders.filter(function(o){ return ACTIVE_STATUSES.indexOf(o.orderStatus) !== -1; }).length;
    var todayNew = state.orders.filter(function(o){ return o.orderDate === TODAY; }).length;

    var tiles = [
      {label:"전체 주문", value: total, unit:"건"},
      {label:"진행중", value: active, unit:"건"},
      {label:"오늘 신규 주문", value: todayNew, unit:"건"}
    ];
    document.getElementById("stats").innerHTML = tiles.map(function(t){
      return '<div class="stat">' +
        '<div class="label"><span class="dot"></span>'+t.label+'</div>' +
        '<div class="value">'+ t.value + ' <small>'+t.unit+'</small></div>' +
      '</div>';
    }).join("");
    document.getElementById("bellBadge").textContent = todayNew;
    var summaryBadge = document.getElementById("summaryBadge");
    if(summaryBadge) summaryBadge.textContent = "진행중 " + active;
  }

  function switchView(view){
    state.view = view;
    document.querySelectorAll("#viewTabs .view-tab").forEach(function(t){
      t.classList.toggle("active", t.getAttribute("data-view") === view);
    });
    document.getElementById("summaryView").hidden = view !== "summary";
    document.getElementById("listView").hidden = view !== "list";
  }

  function renderChips(){
    var counts = {"전체": state.orders.length};
    STATUS_LIST.forEach(function(s){ counts[s] = state.orders.filter(function(o){return o.orderStatus===s;}).length; });
    var all = ["전체"].concat(STATUS_LIST);
    document.getElementById("statusChips").innerHTML = all.map(function(s){
      return '<button type="button" class="chip'+(state.status===s?' active':'')+'" data-status="'+s+'">'+
        s + ' <b>' + counts[s] + '</b></button>';
    }).join("");
  }

  function getFiltered(){
    var q = state.search.trim().toLowerCase();
    var list = state.orders.filter(function(o){
      if(state.status !== "전체" && o.orderStatus !== state.status) return false;
      if(state.productFilter && o.productName !== state.productFilter) return false;
      if(!state.showAllDates && state.orderDateFilter && o.orderDate !== state.orderDateFilter) return false;
      if(state.paymentFilter !== "전체" && o.paymentStatus !== state.paymentFilter) return false;
      if(!q) return true;
      var hay = [o.orderNo,o.customerName,o.phone,o.productName].join(" ").toLowerCase();
      return hay.indexOf(q) !== -1;
    });
    list.sort(function(a,b){
      switch(state.sort){
        case "orderDateAsc": return a.orderDate.localeCompare(b.orderDate);
        case "weddingDateAsc": return a.weddingDate.localeCompare(b.weddingDate);
        case "amountDesc": return (b.quantity*b.unitPrice) - (a.quantity*a.unitPrice);
        default: return b.orderDate.localeCompare(a.orderDate);
      }
    });
    return list;
  }

  function renderTable(){
    var list = getFiltered();
    var tbody = document.getElementById("tbody");
    state.selectedIds = state.selectedIds.filter(function(id){
      return state.orders.some(function(o){ return o.id === id; });
    });

    var totalPages = Math.max(1, Math.ceil(list.length / state.pageSize));
    if(state.page > totalPages) state.page = totalPages;
    if(state.page < 1) state.page = 1;
    var startIdx = (state.page - 1) * state.pageSize;
    var pageList = list.slice(startIdx, startIdx + state.pageSize);

    if(list.length === 0){
      tbody.innerHTML = '<tr><td colspan="12"><div class="empty"><div class="big">조건에 맞는 주문이 없어요</div>검색어나 필터를 조정해보세요.</div></td></tr>';
    } else {
      tbody.innerHTML = pageList.map(function(o){
        var checked = state.selectedIds.indexOf(o.id) !== -1;
        var diff = diffDays(o.weddingDate);
        var urgent = diff >= 0 && diff < 10;
        return '<tr data-id="'+o.id+'"'+(checked?' class="is-selected"':'')+'>' +
          '<td class="checkbox-col"><input type="checkbox" class="row-check" data-id="'+o.id+'"'+(checked?' checked':'')+' aria-label="'+esc(o.orderNo)+' 선택" /></td>' +

          '<td><div class="mono wed-date'+(urgent?' urgent':'')+'">'+fmtDate(o.weddingDate)+'</div><div class="subrow'+(urgent?' urgent':'')+'">'+dday(diff)+'</div></td>' +

  function renderBreakdown(){
    var source;
    if(state.breakdownPeriod === "week"){
      var wStart = weekStart(TODAY);
      var wEnd = new Date(wStart); wEnd.setDate(wEnd.getDate() + 6);
      source = state.orders.filter(function(o){
        var d = new Date(o.orderDate + "T00:00:00");
        return d >= wStart && d <= wEnd;
      });
    } else {
      source = state.orders.filter(function(o){ return o.orderDate === TODAY; });
    }
    var counts = {};
    source.forEach(function(o){
      counts[o.productName] = (counts[o.productName] || 0) + 1;
    });
    var entries = Object.keys(counts).map(function(name){
      return { name: name, count: counts[name] };
    });
    entries.sort(function(a,b){ return b.count - a.count; });
    var total = entries.reduce(function(s,e){ return s + e.count; }, 0);

    document.getElementById("breakdownTotal").textContent = total ? ("· 총 " + total + "건") : "";

    var rowsEl = document.getElementById("breakdownList");
    if(entries.length === 0){
      rowsEl.innerHTML = '<div class="breakdown-empty">' + (state.breakdownPeriod === "week" ? "이번 주 등록된 주문이 없어요" : "오늘 등록된 주문이 없어요") + '</div>';
      return;
    }
    rowsEl.innerHTML = entries.map(function(e){
      var active = state.productFilter === e.name;
      return '<button type="button" class="breakdown-row'+(active?' active':'')+'" data-product="'+esc(e.name)+'">' +

  }
  document.getElementById("closeDraftDrawer").addEventListener("click", closeDraftDrawer);
  document.getElementById("closeDraftDrawerBtn2").addEventListener("click", closeDraftDrawer);
  draftOverlay.addEventListener("click", function(e){ if(e.target === draftOverlay) closeDraftDrawer(); });
  document.getElementById("draftFilesInput").addEventListener("change", function(e){
    var o = state.orders.find(function(x){ return x.id === state.draftEditingId; });
    if(!o) return;
    if(!o.drafts) o.drafts = [];
    Array.prototype.forEach.call(e.target.files, function(f){ o.drafts.push(f.name); });
    e.target.value = "";
    save();
    renderDraftFilesList();
  });
  document.getElementById("draftFilesList").addEventListener("click", function(e){
    var btn = e.target.closest(".file-remove");
    if(!btn) return;
    var o = state.orders.find(function(x){ return x.id === state.draftEditingId; });
    if(!o || !o.drafts) return;
    o.drafts.splice(parseInt(btn.getAttribute("data-idx"),10), 1);
    save();
    renderDraftFilesList();
  });

  // ---------- table row actions ----------
  document.getElementById("tbody").addEventListener("click", function(e){
    var noteBtn = e.target.closest('[data-action="note"]');
    if(noteBtn){
      openNoteModal(parseInt(noteBtn.closest("tr").getAttribute("data-id"),10));
      return;
    }
    var filesBtn = e.target.closest('[data-action="files"]');
    if(filesBtn){
      openFilesModal(parseInt(filesBtn.closest("tr").getAttribute("data-id"),10));
      return;
    }
    var customerBtn = e.target.closest('[data-action="customer"]');
    if(customerBtn){
      openCustomerModal(parseInt(customerBtn.closest("tr").getAttribute("data-id"),10));
      return;
    }
    var draftBtn = e.target.closest('[data-action="draft"]');
    if(draftBtn){
      openDraftDrawer(parseInt(draftBtn.closest("tr").getAttribute("data-id"),10));
      return;
    }
    if(e.target.closest(".product-thumb")) return;
    if(e.target.closest(".row-check")) return;
    var tr = e.target.closest("tr[data-id]");
    if(!tr) return;
    var id = parseInt(tr.getAttribute("data-id"),10);
    var o = state.orders.find(function(x){ return x.id === id; });
    if(o && o.orderStatus === "배송완료") openCourierModal(id);
    else openEditOrder(id);
  });
  document.getElementById("tbody").addEventListener("change", function(e){
    if(!e.target.classList.contains("row-check")) return;
    var id = parseInt(e.target.getAttribute("data-id"),10);
    var idx = state.selectedIds.indexOf(id);
    if(e.target.checked && idx === -1) state.selectedIds.push(id);
    if(!e.target.checked && idx !== -1) state.selectedIds.splice(idx,1);
    syncSelectAllCheckbox(currentPageList());
    renderBulkBar();
  });
  document.getElementById("selectAllCheckbox").addEventListener("change", function(e){
    var list = currentPageList();
    if(e.target.checked){
      list.forEach(function(o){ if(state.selectedIds.indexOf(o.id) === -1) state.selectedIds.push(o.id); });
    } else {
      var visibleIds = list.map(function(o){ return o.id; });
      state.selectedIds = state.selectedIds.filter(function(id){ return visibleIds.indexOf(id) === -1; });
    }
    renderTable();
  });

  // ---------- breakdown filters ----------
  function toggleProductFilter(product){
    state.productFilter = state.productFilter === product ? null : product;
    state.page = 1;
    renderBreakdown(); renderTable();
  }
  document.getElementById("breakdownList").addEventListener("click", function(e){
    var row = e.target.closest(".breakdown-row");
    if(!row) return;
    toggleProductFilter(row.getAttribute("data-product"));
  });

  // ---------- toolbar ----------
  document.getElementById("searchInput").addEventListener("input", function(e){
    state.search = e.target.value; state.page = 1; renderTable();
  });
  var orderDateFilterInput = document.getElementById("orderDateFilter");
  orderDateFilterInput.value = state.orderDateFilter;
  orderDateFilterInput.addEventListener("change", function(e){
    state.orderDateFilter = e.target.value || "";
    state.page = 1;
    renderTable();
  });
  document.getElementById("orderDateFilterWrap").addEventListener("click", function(){
    if(state.showAllDates) return;
    try{ orderDateFilterInput.showPicker(); }catch(err){ orderDateFilterInput.focus(); }
  });
  document.getElementById("showAllDates").addEventListener("change", function(e){
    state.showAllDates = e.target.checked;
    document.getElementById("orderDateFilterWrap").classList.toggle("disabled", state.showAllDates);
    state.page = 1;
    renderTable();
  });
  document.getElementById("statusChips").addEventListener("click", function(e){
    var chip = e.target.closest(".chip");
    if(!chip) return;
    state.status = chip.getAttribute("data-status");
    state.page = 1;
    renderChips(); renderTable();
  });
  document.getElementById("sortSelect").addEventListener("change", function(e){
    state.sort = e.target.value; renderTable();
  });
  document.getElementById("paymentFilterSelect").addEventListener("change", function(e){
    state.paymentFilter = e.target.value; state.page = 1; renderTable();
  });
  document.getElementById("pageSizeSelect").addEventListener("change", function(e){
    state.pageSize = parseInt(e.target.value, 10) || 10;
    state.page = 1;
    renderTable();
  });
  document.getElementById("tableFoot").addEventListener("click", function(e){
    var btn = e.target.closest(".page-btn");
    if(!btn || btn.disabled) return;
    var p = btn.getAttribute("data-page");
    if(p === "prev") state.page -= 1;
    else if(p === "next") state.page += 1;
    else state.page = parseInt(p, 10);
    renderTable();
  });
  document.getElementById("statusQuickTiles").addEventListener("click", function(e){
    var btn = e.target.closest(".quick-stat");
    if(!btn) return;
    openStatusDetail(btn.getAttribute("data-status"));
  });
  var statusDetailOverlay = document.getElementById("statusDetailOverlay");
  document.getElementById("closeStatusDetailModal").addEventListener("click", closeStatusDetail);
  document.getElementById("closeStatusDetailBtn2").addEventListener("click", closeStatusDetail);
  statusDetailOverlay.addEventListener("click", function(e){ if(e.target === statusDetailOverlay) closeStatusDetail(); });
  document.getElementById("statusDetailList").addEventListener("click", function(e){
    var row = e.target.closest(".breakdown-row");
    if(!row) return;
    state.status = row.getAttribute("data-status");
    state.productFilter = row.getAttribute("data-product");
    state.page = 1;
    closeStatusDetail();
    renderChips(); renderBreakdown(); renderTable();
    switchView("list");
  });
  document.getElementById("breakdownSeg").addEventListener("click", function(e){
    var btn = e.target.closest(".seg-btn");
    if(!btn) return;
    state.breakdownPeriod = btn.getAttribute("data-period");
    document.querySelectorAll("#breakdownSeg .seg-btn").forEach(function(b){
      b.classList.toggle("active", b === btn);
    });
    renderBreakdown();
  });

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      if(!overlay.hidden) closeOrderModal();
      if(!deleteOverlay.hidden) closeDeleteModal();
      if(!noteOverlay.hidden) closeNoteModal();
      if(!filesOverlay.hidden) closeFilesModal();
      if(!courierOverlay.hidden) closeCourierModal();
      if(!statusDetailOverlay.hidden) closeStatusDetail();
      if(!customerOverlay.hidden) closeCustomerModal();
      if(!draftOverlay.hidden) closeDraftDrawer();
    }
  });

  // ---------- sidebar nav ----------
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 1800);
  }
  document.getElementById("sidebarNav").addEventListener("click", function(e){
    var item = e.target.closest(".nav-item");
    if(!item) return;
    e.preventDefault();
    if(item.classList.contains("active")) return;
    showToast("준비 중인 화면이에요");
  });

  // ---------- quick stats date picker ----------
  var quickStatsDateInput = document.getElementById("quickStatsDate");
  quickStatsDateInput.value = state.quickStatsDate;
  quickStatsDateInput.addEventListener("change", function(e){
    state.quickStatsDate = e.target.value || TODAY;
    renderQuickStats();
  });
  document.getElementById("quickStatsDateWrap").addEventListener("click", function(){
    try{ quickStatsDateInput.showPicker(); }catch(err){ quickStatsDateInput.focus(); }
  });

  document.getElementById("viewTabs").addEventListener("click", function(e){
    var tab = e.target.closest(".view-tab");
    if(!tab) return;
    switchView(tab.getAttribute("data-view"));
  });

  // ---------- init ----------
  document.getElementById("todayLabel").textContent = TODAY.replace(/-/g,".") + " 기준";
  load();
  renderAll();
  switchView(state.view);
})();
</script>

</body></html>
